<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>심플테크 — 데모</title>
<style>
  :root{--navy:#12324f;--line:#e2e8f0;--line2:#cfd8e3;--bg:#f4f6f9;--muted:#6b7785;--tx:#1f2328}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--tx);font-size:15px;line-height:1.55;word-break:keep-all;
    -webkit-text-size-adjust:100%}
  a{color:inherit;text-decoration:none}
  header{background:var(--navy);color:#fff;padding:14px 0}
  .wrap{max-width:1000px;margin:0 auto;padding:0 22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
  .logo{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--navy);
    display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand small{font-weight:600;opacity:.72;font-size:12.5px;letter-spacing:.08em}
  .hero{padding:52px 0 26px}
  h1{font-size:31px;letter-spacing:-.03em;color:var(--navy);line-height:1.25}
  .hero p{color:#4a5866;margin-top:12px;font-size:15px;max-width:640px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:8px 0 70px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;
    display:flex;flex-direction:column;gap:10px;transition:.16s;min-height:186px}
  .card.live:hover{transform:translateY(-2px);border-color:#9dbcd8;box-shadow:0 10px 24px rgba(18,50,79,.09)}
  .card .tagline{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
    background:#eef4fa;color:var(--navy);border:1px solid #d8e4f0}
  .chip.soon{background:#f3f5f7;color:var(--muted);border-color:#e2e6ec}
  .card h2{font-size:17px;letter-spacing:-.02em;line-height:1.35}
  .card p{font-size:13.5px;color:#5b6876;flex:1}
  .card .go{font-size:13px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px}
  .card.dim{opacity:.62}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:12.5px}
  @media(max-width:640px){
    .hero{padding:34px 0 18px}
    h1{font-size:24px}
    .hero p{font-size:14px}
    .grid{grid-template-columns:1fr;gap:12px;padding-bottom:40px}
    .card{min-height:0;padding:17px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap brand"><div class="logo">S</div>심플테크 <small>DEMO</small></div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>데모 목록</h1>
    <p>제안·영업에 사용하는 화면 프로토타입입니다. 실제 서비스가 아니며 데이터는 모두 샘플입니다.</p>
  </div>

  <div class="grid">
    <a class="card live" href="./lms/">
      <div class="tagline">
        <span class="chip">LMS · 에듀테크</span>
        <span class="chip">운영 / 수업 / 학습</span>
      </div>
      <h2>영어학원 LMS</h2>
      <p>상담 접수 → 레벨테스트 응시·자동채점 → 진단서 → 반 배정 → 숙제 → 학부모 리포트 발송까지 한 흐름. 역할 6종 전환.</p>
      <div class="go">데모 열기 →</div>
    </a>

    <div class="card dim">
      <div class="tagline"><span class="chip soon">준비 중</span></div>
      <h2>다음 데모</h2>
      <p>새 프로젝트 데모가 준비되면 이 목록에 추가됩니다.</p>
      <div class="go" style="color:#9aa5b1">—</div>
    </div>
  </div>
</div>

<footer><div class="wrap">심플테크 · 데모 사이트 · 문의는 위시켓 메시지로 부탁드립니다</div></footer>
</body>
</html>
