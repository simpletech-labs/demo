<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>영어학원 LMS — 데모</title>
<style>
  :root{
    --navy:#12324f; --navy-2:#1c4a72; --line:#e2e8f0; --line-2:#cfd8e3;
    --bg:#f4f6f9; --card:#fff; --tx:#1f2328; --muted:#6b7785;
    --green:#0f7b52; --green-bg:#e8f5ee; --amber:#8a5a00; --amber-bg:#fdf3e0;
    --red:#b4451f; --red-bg:#fbf0ec; --blue:#1d5b94; --blue-bg:#eaf1f9;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--tx); font-size:14px; line-height:1.5; word-break:keep-all}
  button{font-family:inherit; font-size:14px; cursor:pointer; border:0; background:none; color:inherit}
  input,select,textarea{font-family:inherit; font-size:14px; color:inherit}

  .demo-bar{background:var(--navy); color:#dfe7f0; font-size:12.5px; padding:7px 16px;
    display:flex; gap:14px; align-items:center; flex-wrap:wrap}
  .demo-bar b{color:#fff}
  .demo-bar .sp{flex:1}
  .demo-bar select{background:#0d2740; color:#fff; border:1px solid #2c5d87; border-radius:6px; padding:3px 6px}

  .shell{display:grid; grid-template-columns:236px 1fr; min-height:calc(100vh - 34px)}
  aside{background:#fff; border-right:1px solid var(--line); padding:16px 12px}
  .brand{display:flex; align-items:center; gap:9px; padding:4px 8px 16px}
  .logo{width:28px; height:28px; border-radius:8px; background:var(--navy); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:13px}
  .brand span{font-weight:700; font-size:14.5px; letter-spacing:-.02em}
  .nav-t{font-size:11px; color:var(--muted); padding:12px 8px 6px; letter-spacing:.04em}
  .hamb{display:none; margin-left:auto; border:1px solid var(--line-2); border-radius:7px;
    width:36px; height:36px; font-size:16px; line-height:1; background:#fff; color:var(--navy)}
  nav a{display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:7px;
    color:#33414f; text-decoration:none; font-size:13.3px; cursor:pointer}
  nav a:hover{background:#f2f5f9}
  nav a.on{background:#eaf1f9; color:var(--navy); font-weight:700}
  nav a i{width:16px; text-align:center; font-style:normal; opacity:.75}

  main{padding:22px 26px 44px; max-width:1180px}
  header.page{display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; margin-bottom:16px; flex-wrap:wrap}
  h1{font-size:20px; letter-spacing:-.02em}
  h2{font-size:15px; letter-spacing:-.01em; margin-bottom:10px}
  .sub{color:var(--muted); font-size:12.8px; margin-top:3px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  /* ── 모바일 ── */
  @media(max-width:900px){
    .shell{grid-template-columns:minmax(0,1fr);align-content:start}
    main{padding:16px 14px 40px;min-width:0}
    aside{min-width:0}
    .g2,.g3{grid-template-columns:1fr}
    .g4{grid-template-columns:1fr 1fr}
    aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 10px 8px;
      position:sticky;top:0;z-index:20;background:#fff}
    .brand{padding:2px 4px 8px}
    .brand span{font-size:13.5px}
    /* 모바일: 햄버거 드로어. 닫혀 있을 때 세로 공간을 쓰지 않는다. */
    .hamb{display:block}
    nav{display:none;flex-direction:column;gap:2px;padding:6px 0 8px}
    body.nav-open nav{display:flex}
    body.nav-open aside{box-shadow:0 12px 24px rgba(18,50,79,.13)}
    nav a{width:100%;padding:11px 10px;border-radius:8px;font-size:14px;background:#fff;
      border:0;border-bottom:1px solid #f1f4f8}
    nav a:last-child{border-bottom:0}
    nav a.on{background:#eaf1f9;color:var(--navy);font-weight:700}
    .nav-t{display:block;font-size:11.5px;padding:10px 10px 4px}
    h1{font-size:18px}
    header.page{margin-bottom:12px;gap:10px}
    header.page .btn{width:auto;padding:7px 12px;font-size:12.5px;min-height:36px}
    .card{padding:13px 12px;border-radius:9px}
    .kpi{padding:11px 12px}
    .kpi b{font-size:18px}
    .flow{flex-wrap:wrap}
    .flow div{flex:1 1 44%}
    .report{padding:16px 14px}
    .note{font-size:12.5px}
    .small{font-size:12px}
    .badge{font-size:11.5px}
    /* 상단 영역 압축: 데모바 한 줄, 헤더 작게 */
    .demo-bar{font-size:11.5px;padding:5px 12px;gap:8px;line-height:1.2;flex-wrap:nowrap;align-items:center}
    .demo-bar .desc{display:none}
    .demo-bar label{font-size:11px;opacity:.7}
    .demo-bar select{padding:3px 6px;font-size:12px;min-height:26px;max-width:150px;flex:0 0 auto}
    .brand{padding:2px 4px 4px}
    .brand span{font-size:13px}
    .logo{width:24px;height:24px;font-size:12px;border-radius:7px}
    header.page{margin-bottom:10px;gap:6px;align-items:flex-start}
    header.page > div:last-child{margin-left:auto;flex:0 0 auto}
    .crumbs{font-size:10.5px;margin-bottom:1px}
    h1{font-size:16.5px;letter-spacing:-.02em}
    .sub{font-size:12px;margin-top:1px}
    header.page .note{font-size:10.5px}
    header.page > div:last-child b{font-size:14px}
    .prog{margin:0 0 10px}
    .demo-bar .sp{display:none}
    .demo-bar select{flex:1}
    label.f{font-size:12px}
    .row{grid-template-columns:1fr !important}
    .q{padding:13px 12px}
    .q .qt{font-size:13px}
    .opt{padding:9px 10px;font-size:12.8px}
  }
  /* grid 자식의 min-width:auto가 표 때문에 카드를 밀어내지 않게 고정 */
  .grid > *, .card, .kpi, .report, .q { min-width:0; }

  /* 좁은 화면에서는 표를 라벨-값 카드로 세운다(가로 스크롤 없음) */
  @media(max-width:700px){
    .card, .report{overflow-x:visible}
    table{display:block;min-width:0}
    tbody{display:block}
    tr.t-head{display:none}
    tr{display:block;border:1px solid var(--line);border-radius:9px;
      padding:6px 4px;margin-bottom:9px;background:#fff}
    tr:last-child{margin-bottom:0}
    td,th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      border:0;padding:6px 9px;font-size:13px;text-align:right}
    td::before{content:attr(data-label);color:var(--muted);font-size:12px;
      text-align:left;flex:0 0 auto;font-weight:600}
    td[data-label=""]::before, th::before{display:none}
    td.t-right{text-align:right}
    th{background:none;color:inherit}
    tr.t-sum{border-color:var(--navy);background:#f6f9fc}
  }
  /* 701~900px: 카드 안 가로 스크롤. 700 이하에서는 위의 라벨-값 카드로 전환되므로 min-width를 두지 않는다. */
  @media(min-width:701px) and (max-width:900px){
    table{min-width:560px}
    table.wide{min-width:680px}
  }
  /* 하단 탭바: 모바일에서 주요 화면 5개를 한 손으로 */
  .tabbar{display:none}
  @media(max-width:900px){
    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
      border-top:1px solid var(--line-2);padding:4px 4px calc(4px + env(safe-area-inset-bottom));
      box-shadow:0 -6px 16px rgba(18,50,79,.06)}
    .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
      padding:7px 2px;border-radius:8px;color:#5b6876;font-size:11px;min-height:52px}
    .tabbar button i{font-style:normal;font-size:17px;line-height:1}
    .tabbar button.on{color:var(--navy);background:#eef4fa;font-weight:700}
    main{padding-bottom:96px}
    .btn{min-height:42px}
    .btn.sm{min-height:38px}
    .in,select.in{font-size:16px;min-height:44px}   /* iOS 포커스 확대 방지 */
    nav a{min-height:44px;display:flex;align-items:center}
  }
  /* 시험 문항 이동: 좌우 하단, 같은 크기 */
  .qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
  .qnav-btn{min-width:118px;justify-content:center;padding:9px 14px}
  .qnav-spacer{min-width:118px}
  .qnav-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .qnav-count{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.02em}
  .qnav-count span{color:var(--muted);font-weight:600}
  .qnav-bar{display:block;width:100%;max-width:112px;height:4px;border-radius:3px;
    background:#e6ebf2;overflow:hidden}
  .qnav-bar>i{display:block;height:100%;background:var(--navy);border-radius:3px;transition:width .18s}
  /* 시험 진행 표시 */
  .prog{height:5px;border-radius:4px;background:#e6ebf2;overflow:hidden;margin:2px 0 12px}
  .prog>i{display:block;height:100%;background:var(--navy);border-radius:4px;transition:width .18s}
  @media(max-width:560px){
    .g4{grid-template-columns:1fr 1fr}
    .kpi b{font-size:17px}
    .report h3{font-size:15px}
    body{font-size:13.5px}
  }

  .kpi{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
  .kpi b{display:block; font-size:22px; letter-spacing:-.02em; color:var(--navy)}
  .kpi span{font-size:12px; color:var(--muted)}
  .kpi .d{font-size:11.5px; color:var(--green); margin-top:4px}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{text-align:left; font-size:11.5px; color:var(--muted); font-weight:600;
    border-bottom:1px solid var(--line-2); padding:8px 10px; background:#fafbfd}
  td{padding:10px; border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .t-right{text-align:right}
  .badge{display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:20px; font-weight:600}
  .b-new{background:var(--blue-bg); color:var(--blue)}
  .b-done{background:var(--green-bg); color:var(--green)}
  .b-wait{background:var(--amber-bg); color:var(--amber)}
  .b-miss{background:var(--red-bg); color:var(--red)}

  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--navy); color:#fff;
    padding:9px 15px; border-radius:8px; font-weight:600; font-size:13.3px}
  .btn:hover{background:var(--navy-2)}
  .btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line-2)}
  .btn.ghost:hover{background:#f5f8fb}
  .btn.sm{padding:6px 11px; font-size:12.5px; border-radius:7px}

  label.f{display:block; font-size:12.5px; color:#41505f; margin-bottom:5px; font-weight:600}
  .in{width:100%; border:1px solid var(--line-2); border-radius:8px; padding:9px 11px; background:#fff}
  .in:focus{outline:2px solid #cfe0f0; border-color:#9dbcd8}
  .row{display:grid; gap:12px; margin-bottom:13px}

  .bar{height:8px; border-radius:6px; background:#eef1f5; overflow:hidden}
  .bar>i{display:block; height:100%; border-radius:6px; background:var(--navy)}
  .bar.warn>i{background:#c9821f}
  .bar.bad>i{background:#b4451f}

  .q{border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; background:#fff}
  .q .qt{font-weight:600; margin-bottom:10px; font-size:13.6px}
  .opt{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:7px; cursor:pointer; font-size:13.2px}
  .opt:hover{background:#f7f9fc}
  .opt.sel{border-color:var(--navy); background:#eef4fa}
  .opt .n{width:18px; height:18px; border-radius:50%; border:1px solid var(--line-2);
    display:grid; place-items:center; font-size:11px; color:var(--muted); flex:none; margin-top:1px}
  .opt.sel .n{background:var(--navy); color:#fff; border-color:var(--navy)}

  .ai{background:#f6f8fb; border-left:3px solid var(--navy); border-radius:0 8px 8px 0; padding:12px 14px; font-size:13.2px}
  .ai .h{font-size:11.5px; color:var(--navy); font-weight:700; letter-spacing:.03em; margin-bottom:6px}
  .note{font-size:12.2px; color:var(--muted)}
  .hr{height:1px; background:var(--line); margin:16px 0}
  .pill{display:inline-block; font-size:11.5px; border:1px solid var(--line-2); border-radius:20px;
    padding:3px 10px; color:#41505f; margin:0 6px 6px 0; background:#fff}
  .chk{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line-2); display:inline-grid;
    place-items:center; cursor:pointer; background:#fff; color:#fff; font-size:11px}
  .chk.on{background:var(--green); border-color:var(--green)}
  .report{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px 28px}
  .report h3{font-size:17px; letter-spacing:-.02em; margin-bottom:2px}
  .kv{display:grid; grid-template-columns:96px 1fr; gap:5px 10px; font-size:13px}
  .kv dt{color:var(--muted)}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#0d2740; color:#fff; padding:11px 18px; border-radius:9px; font-size:13px;
    opacity:0; transition:.22s; pointer-events:none; z-index:50}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  .crumbs{font-size:12px; color:var(--muted); margin-bottom:6px}
</style>
</head>
<body>

<div class="demo-bar">
  <b>데모</b> <span class="desc">실제 서비스가 아니라 화면 흐름 검증용 프로토타입입니다 · 데이터는 샘플</span>
  <span class="sp"></span>
  <label for="roleSel" style="opacity:.85">역할</label>

    <option value="desk">상담실장</option>

</div>
<div class="toast" id="toast"></div>
<div class="tabbar" id="tabbar"></div>

function vExam(){
  const e = DB.exam;
  if(state.examDone) return vExamResult();
  const i = state.qIndex || 0;
  const it = e.items[i];
  const answered = Object.keys(state.answers).length;
  const isLast = i === e.total - 1;
  return `
  <header class="page">
    <div><div class="crumbs">학습 · 학생</div><h1>레벨테스트 응시</h1>

  </header>

  <div class="q">
    <div class="qt">${i+1}. ${it.q}</div>
    ${it.opts.map((o,j)=>`<div class="opt ${state.answers[i]===j?'sel':''}" onclick="pick(${i},${j})">
      <span class="n">${'ABCD'[j]}</span><span>${o}</span></div>`).join('')}
  </div>
  <div class="qnav">
    ${i>0
      ? `<button class="btn ghost qnav-btn" onclick="prevQ()">← 이전 문항</button>`
      : `<span class="qnav-spacer"></span>`}
    <div class="qnav-mid">
      <span class="qnav-count">${i+1} / ${e.total}</span>
      <span class="qnav-bar"><i style="width:${Math.round((i+1)/e.total*100)}%"></i></span>
    </div>
    ${isLast
      ? `<button class="btn qnav-btn" onclick="submitExam()">제출하기</button>`
      : `<button class="btn qnav-btn" onclick="nextQ()">다음 문항 →</button>`}
  </div>
  <p class="note" style="margin-top:12px">제출 시 응답은 수정 불가 스냅샷으로 저장되고, 재응시는 새 응시 건으로 남습니다.</p>`;
}
function prevQ(){
  const cur = state.qIndex || 0;
  if(cur > 0) state.qIndex = cur - 1;
  render();
}
function nextQ(){
  const last = DB.exam.total - 1;
  const cur = state.qIndex || 0;
  if(state.answers[cur] === undefined){ toast('답을 고르면 다음 문항으로 넘어갑니다'); return; }
  if(cur < last) state.qIndex = cur + 1;
  render();
}
function pick(i,j){
  state.answers[i] = j;
  const last = DB.exam.total - 1;
  if(i < last){ state.qIndex = i + 1; }
  render();
}
function submitExam(){
  if(Object.keys(state.answers).length < DB.exam.total){
    const missing = DB.exam.items.findIndex((_,i)=>state.answers[i]===undefined);
    toast('응답하지 않은 문항이 있습니다'); state.qIndex = missing < 0 ? 0 : missing; render(); return;
  }
  state.examDone = true; state.qIndex = 0; render();
}
function vExamResult(){
  let correct = 0, wrong=[];
  DB.exam.items.forEach((it,i)=>{ if(state.answers[i]===it.ans) correct++;
    else wrong.push(it.area); });
  const pct = Math.round(correct/DB.exam.total*100);
  return `
  <header class="page">
    <div><div class="crumbs">학습 · 학생</div><h1>제출 완료</h1>
    <div class="sub">응답이 저장되었습니다 · 채점은 운영자 확인 후 확정됩니다</div></div>
    <button class="btn ghost" onclick="state.examDone=false; state.answers={}; render()">다시 응시</button>
  </header>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="kpi"><span>정답</span><b>${correct} / ${DB.exam.total}</b></div>
    <div class="kpi"><span>정답률</span><b>${pct}%</b></div>
    <div class="kpi"><span>취약 영역</span><b style="font-size:14px">${wrong[0]||'없음'}</b></div>
  </div>
  <div class="card">
    <h2>문항별 결과</h2>
    <table><tr><th>#</th><th>영역</th><th>내 답</th><th>정답</th><th class="t-right">결과</th></tr>
    ${DB.exam.items.map((it,i)=>`<tr><td>${i+1}</td><td>${it.area}</td>
      <td>${'ABCD'[state.answers[i]]||'-'}</td><td>${'ABCD'[it.ans]}</td>
      <td class="t-right">${state.answers[i]===it.ans?badge('정답'):badge('오답')}</td></tr>`).join('')}</table>
    <p class="note" style="margin-top:10px">학생 화면에는 정오답만 보이고, 영역별 진단서와 보완 방향은 운영자·강사 화면에서 확인·승인 후 전달됩니다.</p>
  </div>`;
}

/* ───────────── 라우팅 ───────────── */
const RENDER = {dashboard:vDashboard, applications:vApplications, diagnosis:vDiagnosis,
  classes:vClasses, attendance:vAttendance, homework:vHomework, exam:vExam,
  'report-admin':vReportAdmin, 'report-view':vReportView, landing:vLanding, proposal:vProposal};

function nav(){
  const groups = {};
  VIEWS.filter(v=>v.roles.includes(state.role)).forEach(v=>{
    (groups[v.group] = groups[v.group] || []).push(v);
  });
  $('#nav').innerHTML = Object.entries(groups).map(([g,items])=>`
    <div class="nav-t">${g}</div>
    ${items.map(v=>`<a class="${state.view===v.id?'on':''}" onclick="go('${v.id}')">
      <i>${v.icon}</i>${v.label}</a>`).join('')}`).join('');
}
function go(id){
  state.view = id;
  history.replaceState(null,'','#'+id);
  const allowed = VIEWS.find(v=>v.id===id).roles;
  if(!allowed.includes(state.role)){
    state.role = allowed.includes('teacher')?'teacher':allowed[0];
    $('#roleSel').value = state.role;
  }
  render();
}
// 좁은 화면에서 표를 라벨-값 카드로 세우기 위해 헤더 텍스트를 각 셀에 심는다
function enhanceTables(){
  document.querySelectorAll('#app table').forEach(t=>{
    const rows = [...t.rows];
    if(!rows.length) return;
    const head = [...rows[0].cells];
    if(!head.every(c=>c.tagName==='TH')) return;
    rows[0].classList.add('t-head');
    const labels = head.map(c=>c.innerText.trim());
    rows.slice(1).forEach(r=>{
      const cells = [...r.cells];
      if(cells.every(c=>c.tagName==='TH')) { r.classList.add('t-sum'); return; }
      cells.forEach((c,i)=>{ c.setAttribute('data-label', c.colSpan>1 ? '' : (labels[i]||'')); });
    });
  });
}
function render(){
  nav();
  drawTabs();
  const fn = RENDER[state.view] || vDashboard;
  $('#app').innerHTML = fn();
  enhanceTables();
  document.body.classList.remove('nav-open');
  window.scrollTo({top:0});
}
$('#navBtn').addEventListener('click', ()=>document.body.classList.toggle('nav-open'));
function drawTabs(){
  const ids = TABS[state.role] || [];
  const el = $('#tabbar');
  el.innerHTML = ids.map(id=>{
    const v = VIEWS.find(x=>x.id===id);
    return `<button class="${state.view===id?'on':''}" onclick="go('${id}')">
      <i>${v.icon}</i><span>${v.label}</span></button>`;
  }).join('');
}

$('#roleSel').addEventListener('change', e=>{
  state.role = e.target.value;
  const first = VIEWS.find(v=>v.roles.includes(state.role));
  state.view = state.role==='public' ? 'landing'
    : state.role==='student' ? 'exam'
    : state.role==='parent' ? 'report-view'
    : state.role==='teacher' ? 'attendance' : 'dashboard';
  state.examDone = false; state.answers = {}; state.qIndex = 0;
  render();
});

// URL 해시로 화면 공유 (#dashboard, #report-view …)
(function initFromHash(){
  const id = (location.hash||'').replace('#','');
  const v = VIEWS.find(x=>x.id===id);
  if(v){
    state.view = v.id;
    if(!v.roles.includes(state.role)){ state.role = v.roles[0]; $('#roleSel').value = state.role; }
  }
})();
render();
</script>
